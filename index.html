<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Juego de piedra papel y tijeras" />
    <link rel="stylesheet" href="./style.css" />
    <title>juego de piedra papel y tijeras</title>
  </head>
  <body class="flex flex-col min-h-screen bg-gray-900 text-white">
    <header
      class="flex justify-between bg-gray-800 border-b-2 border-[#713DCC] p-3"
    >
      <span
        class="text-2xl font-bold inline-block bg-gradient-to-r from-green-500 to-purple-500 bg-clip-text tracking-wider text-transparent drop-shadow-[0_0_12px_rgba(34,197,94,0.35)]"
        >GAMEZONE</span
      >
    </header>
    <main class="h-screen">
      <div
        class="h-screen bg-[#0b101b] bg-[radial-gradient(circle_at_20%_40%,rgba(16,185,129,0.18),transparent_45%),radial-gradient(circle_at_80%_60%,rgba(168,85,247,0.22),transparent_45%)] flex flex-col justify-center items-center"
      >
        <div
          class="flex flex-col items-center bg-gray-800 p-8 md:p-12 rounded-lg shadow-lg"
        >
          <span class="text-xl md:text-3xl font-bold pb-2 md:pb-5"
            >PIEDRA, PAPEL O TIJERAS</span
          >
          <div class="flex-col md:flex flex-row">
            <div
              class="border border-green-500/30 bg-green-900 flex flex-col items-center p-4 rounded-lg mt-3"
            >
              <span
                class="flex justify-center font-bold border-b-1 border-green-700 w-full pb-1"
                >TU SELECCION</span
              >
              <div class="pt-3">
                <select
                  id="playerChoice"
                  class="bg-transparent border-2 border-green-700 text-white px-8 py-1 rounded-lg"
                >
                  <option class="bg-gray-700" value="Piedra">Piedra 🪨</option>
                  <option class="bg-gray-700" value="Papel">Papel 📄</option>
                  <option class="bg-gray-700" value="Tijeras">
                    Tijeras ✂️
                  </option>
                </select>
              </div>
            </div>
            <div
              class="flex items-center justify-center text-2xl font-bold p-5 md:p-8"
            >
              <span>VS </span>
            </div>
            <div
              class="border border-purple-500/30 bg-[#231736] flex flex-col items-center p-4 rounded-lg mt-3"
            >
              <span
                class="flex justify-center font-bold border-b-1 border-purple-500/30 w-full pb-1"
                >CONTRINCANTE (PC)</span
              >
              <div class="pt-4">
                <div id="pcChoice">Aleatorio 🎲</div>
              </div>
            </div>
          </div>
          <div class="flex flex-col items-center pt-7">
            <button
              id="playButton"
              class="bg-gradient-to-r from-green-700 to-purple-700 text-white px-10 py-2 rounded-lg hover:from-purple-500 hover:to-green-500 transition-colors duration-300"
            >
              <span class="text-2xl font-bold">JUGAR</span>
            </button>
            <span class="pt-4 text-2xl">Historial de partidas:</span>
            <div id="result" class="mt-4 text-xl font-bold"></div>
          </div>
        </div>
      </div>
    </main>
    <footer class="flex justify-center border-t-2 border-[#6B25E4] p-2">
      <p>
        © 2026 Juego interativo desarrollado por Gabriel Vallejo. Todos los
        derechos reservados.
      </p>
    </footer>
    <script src="./main.js"></script>
  </body>
</html>
